<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Xmas List">
  <title>Christmas Shopping</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header class="nav" id="nav">
      <div class="nav-row">
        <h1 class="title" id="title">All Items</h1>
        <span class="meta"><span id="counts"></span><span class="sync" id="sync" aria-live="polite"></span><span class="me" id="me"></span><span class="ver" id="ver"></span></span>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
      </div>
    </header>
    <div class="ptr" id="ptr" aria-hidden="true"><div class="spinner"></div></div>

    <main id="content"></main>

    <button class="fab" id="addBtn" aria-label="Add item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span>Add</span>
    </button>

    <nav class="tabbar" role="tablist">
      <button class="tab active" data-tab="all" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="6" r="1.4" fill="currentColor"/><circle cx="4" cy="12" r="1.4" fill="currentColor"/><circle cx="4" cy="18" r="1.4" fill="currentColor"/></svg>
        <span>All</span>
      </button>
      <button class="tab" data-tab="day" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>By Day</span>
      </button>
      <button class="tab" data-tab="meal" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v7a2 2 0 0 1-2 2v9M7 3v7a2 2 0 0 0 2 2v9M5 3v5M9 3v5M17 21V3c-2.5 1-4 4-4 8h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>By Meal</span>
      </button>
      <button class="tab" data-tab="aisle" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.1L21 8H6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="20" r="1.5" fill="currentColor"/><circle cx="17.5" cy="20" r="1.5" fill="currentColor"/></svg>
        <span>By Aisle</span>
      </button>
    </nav>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grabber"></div>
    <div class="sheet-bar">
      <button class="nav-btn" id="cancelBtn">Cancel</button>
      <h2 id="sheetTitle">New Item</h2>
      <span></span>
    </div>
    <form class="sheet-body" id="form" autocomplete="off">
      <div class="group">
        <input id="fName" class="field" placeholder="Item (e.g. Brussels sprouts)" maxlength="200" enterkeyhint="done">
        <input id="fQty" class="field" placeholder="Quantity (optional)" maxlength="40" enterkeyhint="done">
      </div>

      <div class="group-label">Day <span class="req">Required</span></div>
      <div class="chips" id="dayChips"></div>

      <div class="group-label">Meal <span class="opt">Optional</span></div>
      <div class="segmented" id="mealSeg"></div>

      <button type="button" class="big-add" id="saveBtn" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span id="saveLabel">Add Item</span></button>

      <button type="button" class="group danger" id="deleteBtn" hidden>Delete Item</button>
    </form>
  </section>

  <section class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="grabber"></div>
    <div class="sheet-bar">
      <span></span>
      <h2 id="settingsTitle">Settings</h2>
      <button class="nav-btn strong" id="settingsDone">Done</button>
    </div>
    <div class="sheet-body">
      <p class="intro" id="welcomeText" hidden>Add your name. Everyone on the list sees who added each item.</p>
      <div class="group-label">Your Name</div>
      <div class="group"><input id="sName" class="field" placeholder="First name" maxlength="40" autocomplete="given-name" enterkeyhint="done"></div>
      <div class="group-label">Your Colour</div>
      <div class="swatches" id="swatches"></div>
      <div id="listSettings">
        <div class="group-label">List</div>
        <button type="button" class="group danger" id="clearDone">Clear Bought Items</button>
        <p class="footnote" id="aboutText"></p>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <script src="/version.js"></script>
  <script src="/app.js"></script>
</body>
</html>
